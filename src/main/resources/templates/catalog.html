<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Katalog')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar('catalog')}"></header>

<main>
    <div class="headline">
        <h1>Katalog</h1>
    </div>
    <p class="hint">Merchandise der Java User Group Hamburg.</p>

    <p id="cancelled" class="notice" th:if="${cancelled}">
        Kauf abgebrochen – es wurde nichts berechnet.
    </p>

    <p id="unavailable" class="error" th:if="${unavailable}">
        Der Katalog ist gerade nicht erreichbar. Bitte versuch es gleich noch einmal.
    </p>

    <div class="card">
        <p id="empty" class="empty" th:if="${unavailable == null and #lists.isEmpty(products)}">
            Im Moment gibt es nichts zu kaufen.
        </p>

        <table id="products" th:unless="${#lists.isEmpty(products)}">
            <thead>
            <tr>
                <th>Produkt</th>
                <th class="amount">Preis</th>
                <th><span hidden>Kaufen</span></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="product : ${products}" th:attr="data-id=${product.id}">
                <td class="name" th:text="${product.name}">T-Shirt</td>
                <td class="price data amount" th:text="${@prices.format(product.price)}">35,00 €</td>
                <td class="action">
                    <form method="post" th:action="@{/checkout}">
                        <input type="hidden" name="productId" th:value="${product.id}">
                        <input type="hidden" name="attempt" th:value="${attempts.get(product.id)}">
                        <button type="submit">Kaufen</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
