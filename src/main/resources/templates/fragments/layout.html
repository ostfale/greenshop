<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'greenshop – ' + ${title}">greenshop</title>
    <link rel="preload" as="font" type="font/woff2" crossorigin
          th:href="@{/fonts/archivo-latin-wght-normal.woff2}">
    <link rel="stylesheet" th:href="@{/css/greenshop.css}">
</head>
<body>
<header class="topbar" th:fragment="topbar(here)">
    <a class="wordmark" th:href="@{/}">greenshop</a>
    <nav>
        <a th:href="@{/}" th:classappend="${here} == 'catalog' ? 'here'">Katalog</a>
    </nav>
</header>
</body>
</html>
